spring:
  application:
    name: crudprodutos

  datasource:
    url: jdbc:mysql://localhost:3306/crudprodutos
    username: crudprodutos_app
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html